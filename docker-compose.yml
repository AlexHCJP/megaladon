services:
  app:
    image: ${APP_IMAGE:-alexhcjp/megaladon_back:latest}
    build:
      context: .
      dockerfile: Dockerfile
    container_name: megaladon_app
    restart: unless-stopped
    volumes:
      - app_code:/var/www
      - app_storage:/var/www/storage
    env_file:
      - path: .env
        required: false
    # Маркер ставит entrypoint после того, как код полностью скопирован из
    # образа в том. Без этого `up --wait` возвращает управление деплою слишком
    # рано, и `exec artisan migrate` видит недокопированный vendor.
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/app-ready"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 5s
    networks:
      - megaladon
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
        

  nginx:
    image: nginx:1.25-alpine
    container_name: megaladon_nginx
    restart: unless-stopped
    # Наружу порт больше не публикуем: снаружи ходят только через Caddy
    # по https на api.manovermetal.kz. 8000 остаётся доступен с самого
    # сервера — удобно для curl-проверок в обход прокси.
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - app_code:/var/www
      - app_storage:/var/www/storage
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      megaladon:
      # Общая с прокси сеть: по алиасу megaladon-api Caddy из стека
      # manover-edge отдаёт сюда трафик api.manovermetal.kz.
      manover_edge:
        aliases:
          - megaladon-api
    # Ждём именно готовности, а не запуска: nginx отдаёт файлы из того же тома
    # /var/www и до окончания синхронизации показывал бы полупустой public/.
    depends_on:
      app:
        condition: service_healthy

  db:
    image: mysql:8.0
    container_name: megaladon_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-megaladon}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_USER: ${DB_USERNAME:-megaladon}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - megaladon

  redis:
    image: redis:7-alpine
    container_name: megaladon_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - megaladon

networks:
  megaladon:
    driver: bridge
  # Создаётся один раз вне compose: docker network create manover_edge
  manover_edge:
    external: true

volumes:
  db_data:
  app_code:
  app_storage:
